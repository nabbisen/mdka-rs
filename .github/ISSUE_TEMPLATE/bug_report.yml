name: Bug report
description: Report a reproducible bug
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        A minimal HTML fragment and the exact Markdown, as text, is the whole report.
  - type: dropdown
    id: package
    attributes:
      label: Package
      description: Which package did you use?
      options:
        - Rust crate (crates.io)
        - Node.js (npm)
        - Python (PyPI)
        - CLI binary
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: >-
        Ask mdka itself, so this is the version actually running: `mdka
        --version` on the CLI, or call `version()` — `mdka::version()` in
        Rust, `require('mdka').version()` in Node, `mdka.version()` in
        Python.
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Input HTML
      description: The HTML you converted. Smallest fragment that still shows it.
      render: html
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Markdown
      description: The Markdown mdka produced.
      render: markdown
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Markdown
      description: The Markdown you expected.
      render: markdown
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Conversion mode
      options:
        - Balanced (default)
        - Minimal
        - Not sure
    validations:
      required: true
  - type: checkboxes
    id: options
    attributes:
      label: Options changed from their default
      options:
        - label: preserve_ids
        - label: drop_interactive_shell
        - label: emphasis_from_style
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: >-
        OS, and the runtime for the package above — Node, Python, or rustc
        version, as applicable.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Error output or a panic backtrace, if mdka failed rather than converted.
      render: shell
  - type: textarea
    id: notes
    attributes:
      label: Additional notes
      description: Anything else — a spec link, how you found it.
