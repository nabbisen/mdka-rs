name: PyPi

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  verify-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      # Releases are cut from commits pushed straight to main, where CI is
      # advisory. This is the enforcement point: nothing publishes unless
      # ci.yaml concluded success on this exact commit. Coupled by name to
      # ci.yaml — if that file is renamed, this fails closed (blocks), which
      # is the safe direction.
      - name: Require green CI on the released commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          run_id=$(gh run list --commit "${{ github.sha }}" \
                     --workflow ci.yaml --limit 1 --json databaseId \
                     --jq '.[0].databaseId // empty')
          if [ -z "$run_id" ]; then
            echo "::error::No CI run found for ${{ github.sha }}. Refusing to publish."
            exit 1
          fi
          gh run watch "$run_id" --exit-status

  linux:
    needs: [verify-ci]
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64
          - runner: ubuntu-latest
            target: aarch64

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: 3.x

      - name: Cache cargo dependencies and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Stage README for maturin
        run: cp -f README.md python/

      # [ Pyo3 dependencies ]
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          target: ${{ matrix.platform.target }}
          # RFC 034: no --find-interpreter. PyO3's abi3-py310 feature makes one
          # cp310-abi3 wheel valid on every CPython >= 3.10, so each job builds
          # exactly one wheel instead of one per interpreter the runner happens
          # to carry. The declared set is python/wheel-matrix.toml.
          args: --release --out dist
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: auto

      - name: Require exactly one wheel
        run: |
          set -euo pipefail
          ls -la python/dist
          count=$(find python/dist -maxdepth 1 -name '*.whl' | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "::error::expected exactly 1 wheel in python/dist, found $count"
            exit 1
          fi

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: python/dist

  musllinux:
    needs: [verify-ci]
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64
          - runner: ubuntu-latest
            target: aarch64

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: 3.x

      - name: Cache cargo dependencies and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Stage README for maturin
        run: cp -f README.md python/

      # [ Pyo3 dependencies ]
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          target: ${{ matrix.platform.target }}
          # RFC 034: no --find-interpreter. PyO3's abi3-py310 feature makes one
          # cp310-abi3 wheel valid on every CPython >= 3.10, so each job builds
          # exactly one wheel instead of one per interpreter the runner happens
          # to carry. The declared set is python/wheel-matrix.toml.
          args: --release --out dist
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: musllinux_1_2

      - name: Require exactly one wheel
        run: |
          set -euo pipefail
          ls -la python/dist
          count=$(find python/dist -maxdepth 1 -name '*.whl' | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "::error::expected exactly 1 wheel in python/dist, found $count"
            exit 1
          fi

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-musllinux-${{ matrix.platform.target }}
          path: python/dist

  windows:
    needs: [verify-ci]
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: windows-latest
            target: x64

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
          architecture: ${{ matrix.platform.target }}

      - name: Cache cargo dependencies and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Stage README for maturin
        run: cp -f README.md python/

      # [ Pyo3 dependencies ]
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          target: ${{ matrix.platform.target }}
          # RFC 034: no --find-interpreter. PyO3's abi3-py310 feature makes one
          # cp310-abi3 wheel valid on every CPython >= 3.10, so each job builds
          # exactly one wheel instead of one per interpreter the runner happens
          # to carry. The declared set is python/wheel-matrix.toml.
          args: --release --out dist
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Require exactly one wheel
        run: |
          set -euo pipefail
          ls -la python/dist
          count=$(find python/dist -maxdepth 1 -name '*.whl' | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "::error::expected exactly 1 wheel in python/dist, found $count"
            exit 1
          fi

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: python/dist

  macos:
    needs: [verify-ci]
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: macos-latest
            target: aarch64

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: 3.x

      - name: Cache cargo dependencies and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Stage README for maturin
        run: cp -f README.md python/

      # [ Pyo3 dependencies ]
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          target: ${{ matrix.platform.target }}
          # RFC 034: no --find-interpreter. PyO3's abi3-py310 feature makes one
          # cp310-abi3 wheel valid on every CPython >= 3.10, so each job builds
          # exactly one wheel instead of one per interpreter the runner happens
          # to carry. The declared set is python/wheel-matrix.toml.
          args: --release --out dist
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Require exactly one wheel
        run: |
          set -euo pipefail
          ls -la python/dist
          count=$(find python/dist -maxdepth 1 -name '*.whl' | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "::error::expected exactly 1 wheel in python/dist, found $count"
            exit 1
          fi

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: python/dist

  sdist:
    needs: [verify-ci]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Stage README for maturin
        run: cp -f README.md python/

      # [ Pyo3 dependencies ]
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          command: sdist
          args: --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: python/dist

  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    needs: [linux, musllinux, windows, macos, sdist, verify-ci]
    environment:
      name: pypi
    permissions:
      id-token: write
      contents: read

    steps:
      # For python/wheel-matrix.toml, pyproject.toml and the check script.
      # Checked out before the download, so it cannot clean the artifacts away.
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Collect distributables
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -type f \( -name '*.whl' -o -name '*.tar.gz' \) -exec cp -f {} dist/ \;
          ls -la dist

      # RFC 034 §4.3. The last point where a wrong file set can be prevented:
      # a PyPI filename can never be re-uploaded. Runs on tags AND on
      # workflow_dispatch, so a dry run exercises it. `cp -f` above would let a
      # same-named file from one job overwrite another's; with one wheel per
      # job that cannot happen, and if it ever does it shows up here as a
      # missing file. The published gate runs the same script after upload.
      - name: Check distributables against the declared wheel matrix
        env:
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          set -euo pipefail
          tag_args=()
          if [ -n "$TAG" ]; then tag_args=(--tag "$TAG"); fi
          uv run --no-project --python 3.13 --with packaging -- \
            python .github/workflows/scripts/check-wheel-matrix.py files --dir dist "${tag_args[@]}"

      - name: Publish to PyPI
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: uv publish dist/*
