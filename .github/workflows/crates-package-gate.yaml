name: crates package gate

# RFC 026 §4.2. The `rust` job in ci.yaml runs `cargo test` in-workspace,
# where every path dependency resolves and every file is present. It cannot
# see a crate that compiles here and fails standalone -- through a missing
# `include`, a path dependency with no version, or a file absent from the
# packaged .crate.
#
# `cargo package` (without --no-verify) packages each crate and then builds
# from the extracted package, where path dependencies are stripped. That is
# the consumer's build.
#
# RFC 030: this is ONE `--workspace` invocation, not four per-crate steps,
# and that is deliberate. Packaging the dependents separately makes each
# resolve `mdka` from crates.io -- but on main the workspace version is the
# NEXT version, which is not published yet, so mdka-cli failed with
# "failed to select a version for the requirement mdka = ^X.Y.Z" at every
# release commit. Worse, that failure skipped mdka-node and mdka-python
# entirely, so the red masked the gate's own coverage: across 2.2.2 and
# 2.2.3 nothing verified that those two package and build standalone.
#
# `--workspace` builds a temporary local registry from the packaged members
# (target/package/tmp-registry/) and resolves the dependents against it, so
# it works whether or not the version is published. Do not "simplify" this
# back into four steps.
#
# Its own workflow file, not ci.yaml -- see RFC 026 §3.5 and RFC 020's
# correction record.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  crates-package-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Two exclusions, and each is a stale-source defect the cache key cannot see.
      # The key is hashFiles('**/Cargo.lock'); a change to mdka's source that adds
      # no dependency leaves it unchanged, so the restored cache predates the change.
      #
      # 1. RFC 030 addendum, 2026-09-22: ~/.cargo/registry/src (the extracted
      #    packages `cargo package --workspace` builds the dependents against)
      #    must never be cached. Cargo never re-extracts while a version is
      #    unchanged, so a cached extraction verifies stale source under the
      #    current version number -- this is how RFC 039's
      #    `html_to_markdown_many_with` read as "cannot find function". Only
      #    registry/index and registry/cache (the crates.io download cache) are
      #    cached. ~/.cargo/git is dropped: Cargo.lock has zero git entries.
      #
      # 2. RFC 048 slice 2, 2026-09-26: the COMPILED workspace crates in target/
      #    must not be restored either. `cargo package --workspace` builds the
      #    dependents against `mdka` from a local registry at the workspace
      #    version, and cargo treats a registry-sourced crate as immutable per name
      #    and version, so a restored target/debug/**/*mdka* is reused as "fresh"
      #    (the mechanism is inferred from the measurements below, not read from
      #    cargo) and the dependents are compiled against the OLD mdka: slice 2's
      #    API change made mdka-cli fail with "no method named `display` found
      #    for struct `ConvertResult`" -- a struct that no longer existed.
      #    Third-party dependency builds are what the cache is for and are kept.
      #    (target/package is NOT the cause: it is rewritten on every run, and
      #    excluding it alone still fails. Measured, not assumed: restoring the
      #    pre-change target/ with and without target/package fails both times,
      #    and passes once target/debug/**/*mdka* is dropped.)
      #
      #    The key carries a -v2- namespace, on both `key` and `restore-keys`, and
      #    that is what makes the exclusion take effect. actions/cache does not
      #    save when the primary key hits exactly, and this key cannot move on a
      #    source-only change, so the entry saved before the exclusion existed was
      #    frozen: changing `path` alone only changes what a future save would
      #    hold, and no save happens. restore-keys would also have pulled the old
      #    entry back had the key moved. Bump the namespace whenever what the
      #    cache must not hold changes.
      - name: Cache cargo dependencies and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
            !target/debug/**/*mdka*
          key: ${{ runner.os }}-cargo-package-gate-v2-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-package-gate-v2-

      # No --no-verify anywhere. Packaging without building the result would
      # check that the tarball can be produced, not that it works -- which is
      # the distinction this whole milestone is about.
      #
      # No --keep-going either, deliberately (RFC 032). cargo package --help
      # lists it, but it changed nothing when tested: package verifies members
      # one after another, and the flag only continues within a single build.
      # A second broken crate is still reported only after the first is fixed.
      - name: cargo package --workspace
        run: cargo package --workspace --locked

      # Scoped to the workspace's current version, and asserts there are four
      # of them. target/ is restored from the cache, so an unfiltered glob
      # lists every version packaged since the cache was last cold -- twelve
      # .crate files across three versions, at the time of writing -- which
      # reads as though this run produced them all. The count check also turns
      # the listing from decoration into an assertion that every member was
      # packaged.
      - name: Show what each package actually contains
        run: |
          set -euo pipefail
          version=$(cargo metadata --format-version 1 --no-deps \
                    | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "mdka"))')
          echo "workspace version: $version"

          mapfile -t crates < <(ls target/package/*-"$version".crate)
          if [ "${#crates[@]}" -ne 4 ]; then
            echo "::error::expected 4 .crate files at $version, found ${#crates[@]}"
            printf '  %s\n' "${crates[@]}"
            exit 1
          fi

          for crate in "${crates[@]}"; do
            echo "=== $crate"
            tar -tzf "$crate" | sed 's/^/    /'
          done
