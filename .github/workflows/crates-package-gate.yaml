name: crates package gate

# RFC 026 §4.2. The `rust` job in ci.yaml runs `cargo test` in-workspace,
# where every path dependency resolves and every file is present. It cannot
# see a crate that compiles here and fails standalone -- through a missing
# `include`, a path dependency with no version, or a file absent from the
# packaged .crate.
#
# `cargo package` (without --no-verify) packages each crate and then builds
# from the extracted package, where path dependencies are stripped. That is
# the consumer's build.
#
# RFC 030: this is ONE `--workspace` invocation, not four per-crate steps,
# and that is deliberate. Packaging the dependents separately makes each
# resolve `mdka` from crates.io -- but on main the workspace version is the
# NEXT version, which is not published yet, so mdka-cli failed with
# "failed to select a version for the requirement mdka = ^X.Y.Z" at every
# release commit. Worse, that failure skipped mdka-node and mdka-python
# entirely, so the red masked the gate's own coverage: across 2.2.2 and
# 2.2.3 nothing verified that those two package and build standalone.
#
# `--workspace` builds a temporary local registry from the packaged members
# (target/package/tmp-registry/) and resolves the dependents against it, so
# it works whether or not the version is published. Do not "simplify" this
# back into four steps.
#
# Its own workflow file, not ci.yaml -- see RFC 026 §3.5 and RFC 020's
# correction record.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  crates-package-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Cache cargo dependencies and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-package-gate-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-package-gate-

      # No --no-verify anywhere. Packaging without building the result would
      # check that the tarball can be produced, not that it works -- which is
      # the distinction this whole milestone is about.
      - name: cargo package --workspace
        run: cargo package --workspace --locked

      - name: Show what each package actually contains
        run: |
          set -euo pipefail
          for crate in target/package/*.crate; do
            echo "=== $crate"
            tar -tzf "$crate" | sed 's/^/    /'
          done
