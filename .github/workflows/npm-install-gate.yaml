name: npm install gate

# RFC 020 correction: this gate must not live in ci.yaml. release-npm.yaml's
# verify-ci job keys on ci.yaml's conclusion to decide whether a release may
# proceed at all; putting an artifact gate that verifies what a release
# *produced* inside the workflow that decides whether a release may
# *proceed* means a broken artifact can never be fixed by a release -- the
# gate cannot pass until the platform packages are published, and publishing
# requires this workflow to be green. Same rule applies to RFC 026's three
# remaining consumer-artifact gates: each gets its own workflow file.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  npm-install-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: node/package-lock.json

      - name: Cache cargo dependencies and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-npm-gate-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-npm-gate-

      - name: npm ci
        working-directory: node
        run: npm ci

      - name: npm run build
        working-directory: node
        run: npm run build

      # RFC 020: `npm install mdka` produced an unusable package for the
      # entire 2.x line, unnoticed because nothing ever installed the
      # *packed tarball* -- testing against the checked-out source tree, as
      # ci.yaml's `node` job does, passes unconditionally regardless of
      # whether the published package works, since the compiled binding is
      # never in the tarball's `files` list. Real consumers get it only via
      # optionalDependencies resolving a per-platform package from the
      # registry. This job packs the real artifact and installs it in a
      # directory outside the checked-out workspace, so it fails exactly
      # the way `npm install mdka` fails for a real user.
      - name: Pack the npm package
        working-directory: node
        run: npm pack --pack-destination "$RUNNER_TEMP"

      - name: Install the packed tarball outside the workspace and require it
        run: |
          set -euo pipefail
          tarball=$(ls "$RUNNER_TEMP"/mdka-*.tgz)
          install_dir="$RUNNER_TEMP/npm-install-gate"
          mkdir -p "$install_dir"
          cd "$install_dir"
          npm init -y >/dev/null
          npm install "$tarball"
          node -e "
            const m = require('mdka');
            const out = m.htmlToMarkdown('<h1>x</h1>');
            if (!out.includes('# x')) {
              console.error('unexpected output: ' + JSON.stringify(out));
              process.exit(1);
            }
            console.log('OK:', JSON.stringify(out));
          "
