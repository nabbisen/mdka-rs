name: npm install gate

# RFC 020 / RFC 026. This gate must NOT live in ci.yaml: release-npm.yaml and
# create-release.yaml gate on ci.yaml's conclusion, so a red gate there blocks
# the very release that would make it pass. See RFC 020's correction record.
#
# It installs the PUBLISHED package from the registry, the way a consumer does.
#
# It deliberately does not pack and install the local tarball. That was the
# original design and it could never pass: `optionalDependencies` are injected
# by `napi pre-publish` at release time, so a locally packed tarball has none,
# resolves no per-platform package, and always fails to load. It was testing an
# artifact that is not the one published.
#
# Consequence, stated rather than hidden: this gate reports on the LAST
# PUBLISHED release, not on the current working tree. That lag is inherent --
# a published artifact cannot be verified before it is published. What it buys
# is an alarm that would have been red for all twelve broken 2.x releases.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Catch a registry-side regression even when nobody pushes.
    - cron: '0 6 * * 1'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  npm-install-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install the published package from the registry and require it
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/npm-install-gate"
          mkdir -p "$install_dir"
          cd "$install_dir"
          npm init -y >/dev/null

          published=$(npm view mdka version)
          echo "Testing published mdka@${published}"
          npm install "mdka@${published}"

          node -e "
            const m = require('mdka');
            const out = m.htmlToMarkdown('<h1>x</h1>');
            if (!out.includes('# x')) {
              console.error('unexpected output: ' + JSON.stringify(out));
              process.exit(1);
            }
            console.log('OK: mdka@${published} installs and converts:', JSON.stringify(out));
          "
