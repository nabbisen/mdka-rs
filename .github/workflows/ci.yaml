name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Cache cargo dependencies and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-rust-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-rust-

      - name: Ensure rustfmt and clippy components
        run: rustup component add rustfmt clippy

      - name: cargo fmt --check
        run: cargo fmt --check

      # --keep-going (RFC 032): report every crate's lint failures, not just the
      # first crate's. clippy --help does not list it, but clippy passes it to
      # cargo check and it was seen to change the output. Keep it before `--`.
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features --keep-going -- -D warnings

      # --no-fail-fast (RFC 032): without it the first failing test binary stops
      # the rest, so a failure in one binary hides failures in all later ones.
      - name: cargo test
        run: cargo test --workspace --all-features --locked --no-fail-fast

      # RFC 039 §3 A4 / §5 criterion 2: `parallel` off must change only how
      # bulk conversion runs, never which functions exist -- pinned here so
      # a feature-gated function set cannot silently regress.
      # --manifest-path (not -p mdka): the crate name alone is ambiguous once
      # any dependency in the lockfile also happens to be named `mdka`; the
      # manifest path selects this crate unambiguously and, without
      # --workspace, runs only it -- the other members have no `parallel`
      # feature of their own to disable.
      - name: cargo test (mdka, no default features)
        run: cargo test --manifest-path Cargo.toml --no-default-features --locked --no-fail-fast

      # --keep-going (RFC 032): report every target that fails to compile.
      - name: cargo build
        run: cargo build --workspace --locked --keep-going

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Cache cargo dependencies and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-msrv1.88-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-msrv1.88-

      # Pinned to the published MSRV (rust-version in Cargo.toml). Corrected
      # 2026-08-02 from 1.85 to 1.88: scraper (both 0.26.0 and 0.27.0) uses
      # let-chains, stabilized in 1.88 — the 1.85 claim was never true. Do not
      # raise this further to make resolution pass; that redefines the
      # published MSRV, which is an owner decision.
      - name: Install Rust 1.88 (MSRV)
        run: |
          rustup toolchain install 1.88 --profile minimal
          rustup override set 1.88

      # --all-targets is deliberately omitted: bench dev-dependencies require a
      # newer toolchain and are advisory only, not part of the published MSRV.
      # --locked verifies the same dependency set the `rust` job saw.
      # --keep-going (RFC 032): report every crate that fails to check on the
      # MSRV toolchain, not just the first. Verified on 1.88.
      - name: cargo check
        run: cargo check --workspace --locked --keep-going

  node:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: node/package-lock.json

      - name: Cache cargo dependencies and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-node-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-node-

      - name: npm ci
        working-directory: node
        run: npm ci

      - name: npm run build
        working-directory: node
        run: npm run build

      - name: node test.js
        working-directory: node
        run: node test.js

      # RFC 040: the package entry point (loader.js), which test.js does not go
      # through. Also asserts the platform list in loader.js against
      # napi.targets and release-npm.yaml, so a target added to one place and
      # not the others fails here rather than shipping a false message.
      - name: node test-loader.js
        working-directory: node
        run: node test-loader.js

      # index.d.ts is generated from Rust doc comments and is both committed and
      # published to npm. This keeps the shipped type definitions honest.
      - name: Verify index.d.ts has no drift
        run: git diff --exit-code node/index.d.ts

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # RFC 034: the declared floor (python/wheel-matrix.toml python-floor)
        # and the newest stable CPython. The floor entry is asserted equal to
        # python-floor below. When CI can no longer install the floor, this
        # job goes red -- that is trigger 1 for raising it.
        python: ["3.10", "3.x"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Cache cargo dependencies and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-python-${{ matrix.python }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-python-${{ matrix.python }}-

      # python/pyproject.toml declares readme = "README.md" but the README lives
      # at the repository root. Required — omitting this fails the build (see
      # commit 3da9ce3, "fix readme was missing in pypi").
      - name: Stage README for maturin
        run: cp -f README.md python/

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      # The script needs Python >= 3.11 (tomllib), so uv supplies one
      # separately from the interpreter under test.
      - name: Declared floor matches this matrix and the manifests
        run: |
          set -euo pipefail
          check() {
            uv run --no-project --python 3.13 --with packaging -- \
              python .github/workflows/scripts/check-wheel-matrix.py "$@"
          }
          if [ "${{ matrix.python }}" != "3.x" ]; then
            check floor-equals "ci.yaml python matrix" "${{ matrix.python }}"
          fi
          check floor-manifests

      # `uv venv` alone may pick a different interpreter than the matrix one;
      # name it explicitly and print what the venv actually runs.
      - name: Install maturin and pytest
        run: |
          uv venv --python "$(python -c 'import sys; print(sys.executable)')"
          source .venv/bin/activate
          python --version
          uv pip install maturin pytest

      - name: maturin develop
        working-directory: python
        run: |
          source ../.venv/bin/activate
          maturin develop

      - name: pytest
        working-directory: python
        run: |
          source ../.venv/bin/activate
          python --version
          python -m pytest test_mdka.py

      # RFC 045: the type stubs (python/mdka/*.pyi) are a second description of
      # the extension's surface. stubtest imports the module just built above
      # and fails on anything missing, extra or differently shaped, so the stubs
      # cannot drift from the runtime unnoticed. It cannot see a class variable
      # the stub declares and the runtime lacks; pytest covers that one
      # (test_stub_class_variables_exist_at_runtime).
      - name: stubtest
        working-directory: python
        run: |
          source ../.venv/bin/activate
          uv pip install mypy
          python -m mypy.stubtest mdka
