[book]
title       = "mdka — HTML to Markdown converter"
authors     = ["nabbisen"]
description = "mdka: A HTML to Markdown converter that balances conversion quality with runtime efficiency"

language    = "en"

src         = "src"

[build]
build-dir = "book"

[output.html]
git-repository-url  = "https://github.com/nabbisen/mdka-rs"
edit-url-template   = "https://github.com/nabbisen/mdka-rs/edit/main/docs/{path}"

no-section-label    = false

additional-css      = []

[output.html.search]
enable        = true
limit-results = 20

# No Run button. The Rust playground offers a fixed crate set and mdka is not in
# it, so every example that imports mdka -- 20 of the 32 rust fences, including
# every correct one -- could only produce `unresolved import`. The docs example
# gate compiles each block against the real crate and does not depend on this.
[output.html.playground]
runnable = false
